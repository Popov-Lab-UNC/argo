[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo"
version = "0.1.0"
description = "A framework for in silico molecular design with unified interface to generative models"
authors = [
    { name = "Shu-Hang Lin", email = "shuhang@unc.edu" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["molecular-design", "drug-discovery", "generative-models", "chemistry", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "safe-mol>=0.1.13",
    "pytest>=7.0.0",
    "rdkit>=2025.3.5",
    "numpy>=1.21.0",
    "transformers==4.38.2",
    "prolif==2.0.3"
]

[project.optional-dependencies]
scoring = [
    "chemprop>=2.2.0"
]
viz = [
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
    "nbformat>=4.2.0",
    "py3Dmol>=2.5.2"
]

[project.urls]
Homepage = "https://github.com/shuhang/argo"
Repository = "https://github.com/shuhang/argo.git"
"Bug Tracker" = "https://github.com/shuhang/argo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["argo*"]

[tool.setuptools.package-data]
"argo" = ["*.json", "*.yaml", "*.yml", "*.txt"]